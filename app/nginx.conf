server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The app holds the owner key: no framing, no sniffing, no referrers,
    # and only our own scripts (plus websockets to Nostr relays)
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # The Android app, published next to the owner app (android/publish.sh,
    # mounted from the host: not in the image or the repo)
    location /download/ {
        types { application/vnd.android.package-archive apk; application/json json; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fingerprinted assets: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The shell and the service worker: always revalidate, so updates land
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
