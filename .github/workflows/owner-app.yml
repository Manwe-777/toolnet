# The owner app on GitHub Pages: https://manwe-777.github.io/toolnet/
# A static build of app/ (relative paths, no backend: it talks to the Nostr
# relays from the browser). Self-hosting the same files works too (app/Dockerfile).
name: owner app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/owner-app.yml"]
  # packaging/release.sh runs it after publishing a release
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      # The APK of the newest release that has one, served next to the app (its
      # download card). Releases carry Linux and Android at the same version
      - name: Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
                  --jq '[.[] | select((.draft or .prerelease | not) and any(.assets[]; .name == "toolnet.apk"))] | first | .tag_name // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D dist/download -p toolnet.apk -p version.json
            echo "Android $tag"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
