[package]
name = "toolnet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
caps = "0.5"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
getrandom = "0.3"
if-addrs = "0.15.0"
iroh = "1.4"
n0-watcher = "1"
nostr = { version = "0.45", features = ["nip44", "rand", "std"] }
nostr-sdk = "0.45.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async"] }
