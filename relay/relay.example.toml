# iroh-relay config for a toolnet relay. Copy to relay.toml (or point an
# override at your own) and fill in the certificate paths and the allowlist.

# Plain HTTP only serves the captive-portal check when TLS is on. Not published.
http_bind_addr = "[::]:8080"
enable_quic_addr_discovery = true
enable_metrics = true
metrics_bind_addr = "[::]:9090"

[tls]
https_bind_addr = "[::]:3340"
quic_bind_addr = "[::]:7842"
# Re-reads the files periodically, so an external renewer (NPM, certbot) works
cert_mode = "Reloading"
manual_cert_path = "/certs/fullchain.pem"
manual_key_path = "/certs/privkey.pem"

# Only these endpoint ids may relay. Everyone else is refused, so the relay
# can't be used as a free relay by strangers. Later: `access.http` pointed at
# toolnetd, which answers from the tailnet's member list.
[access]
allowlist = [
  # "<endpoint id>",  # device name
]
