# toolnet relay: a self-hosted iroh-relay for toolnet peers.
#
# Portable base. Host-specific settings (the config file) go in an override:
#   docker compose -f docker-compose.yml -f my.override.yml up -d --build
#
# One port, forwarded from the router: 3340/tcp, plain HTTP (WebSocket).
# Peers use http://<public ip>:3340. See relay.example.toml for why plain
# HTTP is acceptable.
services:
  relay:
    build: .
    image: toolnet-relay:1.4.1
    container_name: toolnet-relay
    restart: unless-stopped
    volumes:
      - ./relay.toml:/config/relay.toml:ro
    ports:
      - "3340:3340/tcp"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
